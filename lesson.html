<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="lesson-id" content="0"> <!-- set by page-lesson.js -->

<!--
  No inline script anywhere on this site, so script-src can stay at 'self'.
  connect-src allows https: because the faucet origin is configurable in
  config.js; everything else is locked to this origin. There are deliberately
  no third-party requests on any page.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
               form-action 'none';
               frame-ancestors 'none';
               base-uri 'none'">
<meta name="referrer" content="no-referrer">

<title>Veil Academy</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="veil-logo.png">
</head>
<body>

<!-- nav.js injects <header> here -->

<main class="lesson-main">
  <div class="lesson-container">

    <div class="breadcrumb">
      <a href="index.html">Academy</a>
      <span class="crumb-sep">›</span>
      <span id="crumbTitle">Lesson</span>
    </div>

    <div class="lesson-hdr">
      <div class="lesson-num-badge" id="lessonNumBadge">01</div>
      <div>
        <h1 id="lessonTitle">Loading…</h1>
        <p class="lesson-summary" id="lessonSummary"></p>
      </div>
      <div class="lesson-xp-badge" id="lessonXPBadge"><span></span> XP</div>
    </div>

    <article class="lesson-body" id="lessonBody"></article>

    <div class="quiz-divider">
      <span>QUIZ</span>
    </div>

    <div id="quizContainer"></div>

  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <a href="https://veil-project.com" target="_blank" rel="noopener noreferrer">Website</a>
    <a href="https://github.com/Veil-Project/veil/releases" target="_blank" rel="noopener noreferrer">Wallet</a>
    <a href="https://veil.tools" target="_blank" rel="noopener noreferrer">Snapshot</a>
    <a href="https://veil-stats.com" target="_blank" rel="noopener noreferrer">Stats</a>
    <a href="https://explorer.veil-project.com/main" target="_blank" rel="noopener noreferrer">Explorer</a>
    <a href="https://veil-info.org" target="_blank" rel="noopener noreferrer">Veil Info</a>
    <a href="https://github.com/Veil-Project/veil" target="_blank" rel="noopener noreferrer">GitHub</a>
  </div>
</footer>

<script src="config.js"></script>
<script src="confetti.js"></script>
<script src="lessons.js"></script>
<script src="progress.js"></script>
<script src="quiz-reward.js"></script>
<script src="nav.js"></script>
<script src="page-lesson.js"></script>

</body>
</html>
