<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="lesson-id" content="0">
<title>Veil Academy</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="veil-logo.png">
</head>
<body>

<!-- nav.js injects <header> here -->

<main class="home-main">

  <!-- Hero -->
  <section class="hero">
    <img src="veil-logo.png" alt="Veil" class="hero-logo">
    <h1 class="hero-title">Veil <span class="accent">Academy</span></h1>
    <p class="hero-sub">Master privacy. Learn to stake and mine.<br>Complete lessons. Earn real Veil.</p>
    <div class="hero-stats" id="heroStats">
      <div class="stat"><span id="statLessons">11</span><label>Lessons</label></div>
      <div class="stat"><span id="statXP">0</span><label>XP Earned</label></div>
      <div class="stat"><span id="statDone">0</span><label>Completed</label></div>
    </div>
  </section>

  <!-- Lesson grid -->
  <section class="grid-section">
    <div class="lesson-grid" id="lessonGrid"></div>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <a href="https://veil-project.com" target="_blank">Website</a>
    <a href="https://github.com/Veil-Project/veil/releases" target="_blank">Wallet</a>
    <a href="https://veil.tools" target="_blank">Snapshot</a>
    <a href="https://veil-stats.com" target="_blank">Stats</a>
    <a href="https://explorer.veil-project.com/main" target="_blank">Explorer</a>
    <a href="https://veil-info.org" target="_blank">Veil Info</a>
    <a href="https://github.com/Veil-Project/veil" target="_blank">GitHub</a>
  </div>
</footer>

<script src="lessons.js"></script>
<script src="progress.js"></script>
<script src="nav.js"></script>

<script>
(function () {
  const completed = Progress.getCompleted();
  const xp        = Progress.getXP();

  // Hero stats
  document.getElementById("statLessons").textContent = LESSONS.length;
  document.getElementById("statXP").textContent      = xp;
  document.getElementById("statDone").textContent    = completed.length;

  // Build lesson grid dynamically from LESSONS data
  const grid = document.getElementById("lessonGrid");
  grid.innerHTML = LESSONS.map(lesson => {
    const isDone    = completed.includes(lesson.id);
    const isLocked  = !Progress.isUnlocked(lesson.id);
    const cls = ["lesson-card", isDone ? "card-done" : "", isLocked ? "card-locked" : ""].filter(Boolean).join(" ");

    return `
      <a href="${isLocked ? "#" : "lesson.html?id=" + lesson.id}"
         class="${cls}"
         ${isLocked ? 'onclick="return false"' : ""}>
        <div class="card-num">${String(lesson.id).padStart(2, "0")}</div>
        <div class="card-body">
          <strong class="card-title">${lesson.title}</strong>
          <span class="card-summary">${lesson.summary}</span>
        </div>
        <div class="card-meta">
          <span class="card-xp">${lesson.xp} XP</span>
          ${isDone   ? '<span class="card-badge done">✓ Done</span>' : ""}
          ${isLocked ? '<span class="card-badge locked">🔒</span>'  : ""}
        </div>
      </a>`;
  }).join("");
})();
</script>

</body>
</html>
